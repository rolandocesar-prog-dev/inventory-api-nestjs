services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inventory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-inventory}
    ports:
      # 5432, 5433 y 5442 los usan otros proyectos; solo se publica en localhost.
      - '127.0.0.1:5443:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  # Aplica las migraciones pendientes, crea o actualiza el admin (si se definió) y termina.
  # Usa la etapa `build`, que tiene la CLI de Prisma y el código compilado.
  migrate:
    build:
      context: .
      target: build
    command: ['sh', '-c', 'npx prisma migrate deploy && node dist/seed.js']
    environment:
      PRISMA_HIDE_UPDATE_MESSAGE: 'true'
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      DEMO_EMAIL: ${DEMO_EMAIL:-}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-inventory}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-inventory}
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      DATABASE_URL: postgresql://${POSTGRES_USER:-inventory}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-inventory}
      # Orígenes web permitidos (p. ej. la versión web del escáner de facturas).
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  db-data:
