name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint, tipos, pruebas y build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: inventory
          POSTGRES_PASSWORD: inventory
          POSTGRES_DB: inventory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inventory -d inventory_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Solo existe dentro del job; no es un secreto.
      TEST_DATABASE_URL: postgresql://inventory:inventory@localhost:5432/inventory_test
      JWT_SECRET: solo-para-las-pruebas-del-ci-no-es-secreto
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Cliente de Prisma
        run: npm run prisma:generate

      - name: Lint
        run: npm run lint

      - name: Formato
        run: npm run format:check

      - name: Tipos
        run: npm run typecheck

      - name: Pruebas unitarias
        run: npm run test:cov

      - name: Pruebas e2e (PostgreSQL real)
        run: npm run test:e2e

      - name: Build
        run: npm run build

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7

      - name: Build de la imagen
        run: docker build -t inventory-api:ci .
